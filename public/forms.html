<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact form</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Static copy so Netlify Forms can see the fields in the build output. -->
    <form name="contact" method="POST" action="/contact?sent=1" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <button type="submit">Send</button>
    </form>
    <form name="vegas-waitlist" method="POST" action="/products/vegas?joined=1" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vegas-waitlist" />
      <input name="bot-field" />
      <input type="email" name="email" />
      <input type="checkbox" name="community" value="yes" />
      <button type="submit">Join the Waitlist</button>
    </form>
    <form name="vegas-ask-a-local" method="POST" action="/products/vegas?asked=1" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vegas-ask-a-local" />
      <input name="bot-field" />
      <textarea name="question"></textarea>
      <input type="text" name="dates" />
      <input type="email" name="email" />
      <button type="submit">Send the Question</button>
    </form>
    <form name="vegas-local-tip" method="POST" action="/products/vegas?tipped=1" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vegas-local-tip" />
      <input name="bot-field" />
      <textarea name="tip"></textarea>
      <input type="text" name="area" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <button type="submit">Send the Tip</button>
    </form>
  </body>
</html>
